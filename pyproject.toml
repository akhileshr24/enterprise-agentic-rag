[project]
name = "rag-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Akhileh123x", email = "155994498+Akhileh123x@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.1",
    "pydantic-settings>=2.16.3",
    "pymupdf>=2.1",
    "python-multipart>=0.0.33",
    "sentence-transformers>=6.3.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag-system = "rag_system:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
